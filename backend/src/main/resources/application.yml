# .env.example 是模板；真实值由进程环境或被忽略的 application-local.yml 注入。
spring:
  application:
    name: campus-pi-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:campus_pi_local}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      resolve-lazily: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  address: 127.0.0.1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

campus:
  admin:
    # Server-owned user-ID to duty-list JSON. Empty means sensitive duties remain closed.
    duties-json: ${ADMIN_DUTIES_JSON:}
  auth:
    # 注册请求摘要需要稳定的本地密钥，不能设置成示例密钥。
    idempotency-secret: ${AUTH_IDEMPOTENCY_SECRET:}

# Datasource is configured but schema initialization stays manual (see database/README.md).
# Account sessions use transactional JDBC; other business mappers/channels remain pending.
