#数据库个人配置自行写在.env.example文件中
spring:
  application:
    name: campus-pi-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:campus_pi_local}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  address: 127.0.0.1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Datasource is configured but schema initialization stays manual (see database/README.md).
# Business mappers, sessions and external channels are still to be implemented.
