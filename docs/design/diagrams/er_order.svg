<text x="892" y="478" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">users  用户信息</text>
<text x="892" y="539" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">user_id BIGINT PRIMARY KEY AUTO_INCREMENT</text>
<text x="892" y="576" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">account_status VARCHAR(10) NOT NULL DEFAULT &#x27;</text>
