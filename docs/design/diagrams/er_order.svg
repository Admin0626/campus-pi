<text x="892" y="153" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">order_aftersales  订单售后</text>
<text x="892" y="214" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">aftersale_id CHAR(19) PRIMARY KEY</text>
<text x="892" y="251" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">order_id CHAR(19) NOT NULL</text>
<text x="892" y="288" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">user_id BIGINT NOT NULL</text>
<text x="892" y="331" font-family="Microsoft YaHei" font-size="21" fill="#42577a">order_id → user_orders</text>
<text x="892" y="361" font-family="Microsoft YaHei" font-size="21" fill="#42577a">user_id → users</text>
<text x="892" y="387" font-family="Microsoft YaHei" font-size="19" fill="#42577a">其余外键见本节 SQL 定义</text>
