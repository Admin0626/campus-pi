<text x="82" y="864" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">product_id BIGINT PRIMARY KEY AUTO_INCREMENT</text>
<text x="82" y="901" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">user_id BIGINT NOT NULL</text>
<text x="82" y="938" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">category_id INT NOT NULL</text>
<text x="82" y="981" font-family="Microsoft YaHei" font-size="21" fill="#42577a">user_id → users</text>
<text x="82" y="1011" font-family="Microsoft YaHei" font-size="21" fill="#42577a">category_id → category</text>
