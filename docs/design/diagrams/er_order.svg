<text x="892" y="864" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">reward_task_id BIGINT PRIMARY KEY AUTO_INCREM</text>
<text x="892" y="901" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">publisher_id BIGINT NOT NULL</text>
<text x="892" y="938" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">taker_id BIGINT</text>
<text x="892" y="981" font-family="Microsoft YaHei" font-size="21" fill="#42577a">publisher_id → users</text>
<text x="892" y="1011" font-family="Microsoft YaHei" font-size="21" fill="#42577a">taker_id → users</text>
