<text x="82" y="478" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">admin_audit_log  管理操作日志</text>
<text x="82" y="539" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">audit_id BIGINT PRIMARY KEY AUTO_INCREMENT</text>
<text x="82" y="576" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">operator_id BIGINT NOT NULL</text>
<text x="82" y="613" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">object_id VARCHAR(50) NOT NULL</text>
<text x="82" y="656" font-family="Microsoft YaHei" font-size="21" fill="#42577a">operator_id → users</text>
