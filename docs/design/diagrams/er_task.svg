<text x="82" y="153" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">RewardTasks  悬赏任务</text>
<text x="82" y="214" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">reward_task_id BIGINT PRIMARY KEY AUTO_INCREM</text>
<text x="82" y="251" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">publisher_id BIGINT NOT NULL</text>
<text x="82" y="288" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">taker_id BIGINT</text>
<text x="82" y="331" font-family="Microsoft YaHei" font-size="21" fill="#42577a">publisher_id → users</text>
<text x="82" y="361" font-family="Microsoft YaHei" font-size="21" fill="#42577a">taker_id → users</text>
<rect x="875" y="120" width="680" height="270" fill="#f7f9fc" stroke="#aab4c2" stroke-width="2"/>
