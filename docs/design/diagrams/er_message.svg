<text x="892" y="153" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">t_private_msg  私信内容</text>
<text x="892" y="214" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">msg_id BIGINT PRIMARY KEY AUTO_INCREMENT</text>
<text x="892" y="251" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">session_id BIGINT NOT NULL</text>
<text x="892" y="288" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">sender_id BIGINT NOT NULL</text>
<text x="892" y="331" font-family="Microsoft YaHei" font-size="21" fill="#42577a">session_id → t_chat_session</text>
<text x="892" y="361" font-family="Microsoft YaHei" font-size="21" fill="#42577a">sender_id → users</text>
<text x="892" y="387" font-family="Microsoft YaHei" font-size="19" fill="#42577a">其余外键见本节 SQL 定义</text>
