<text x="82" y="1128" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">notification_delivery  通知发送记录</text>
<text x="82" y="1189" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">delivery_id BIGINT PRIMARY KEY AUTO_INCREMENT</text>
<text x="82" y="1226" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">notification_id VARCHAR(50) NOT NULL</text>
<text x="82" y="1263" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">user_id BIGINT NOT NULL</text>
<text x="82" y="1306" font-family="Microsoft YaHei" font-size="21" fill="#42577a">notification_id,user_id → notification_receipts</text>
<rect x="875" y="1095" width="680" height="270" fill="#f7f9fc" stroke="#aab4c2" stroke-width="2"/>
<rect x="875" y="1095" width="680" height="58" fill="#e3e9f3" stroke="#aab4c2" stroke-width="2"/>
<text x="892" y="1128" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">users  用户信息</text>
<text x="892" y="1189" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">user_id BIGINT PRIMARY KEY AUTO_INCREMENT</text>
<text x="892" y="1226" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">account_status VARCHAR(10) NOT NULL DEFAULT &#x27;</text>
<text x="395.0" y="1463" font-family="Microsoft YaHei" font-size="23" fill="#1c2738">父表 1 对子表多条  UNIQUE 外键将关联收紧为至多一条  完整字段以 SQL 为准</text>
