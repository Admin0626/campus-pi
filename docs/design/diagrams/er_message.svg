<text x="892" y="803" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">notification_preferences  通知偏好</text>
<text x="892" y="864" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">user_id BIGINT PRIMARY KEY</text>
<text x="892" y="981" font-family="Microsoft YaHei" font-size="21" fill="#42577a">user_id → users</text>
