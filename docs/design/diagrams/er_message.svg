<text x="82" y="478" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">t_msg_report  私信举报</text>
<text x="82" y="539" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">report_id BIGINT PRIMARY KEY AUTO_INCREMENT</text>
<text x="82" y="576" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">msg_id BIGINT NOT NULL</text>
<text x="82" y="613" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">reporter_id BIGINT NOT NULL</text>
<text x="82" y="656" font-family="Microsoft YaHei" font-size="21" fill="#42577a">msg_id → t_private_msg</text>
<text x="82" y="686" font-family="Microsoft YaHei" font-size="21" fill="#42577a">reporter_id → users</text>
<text x="82" y="712" font-family="Microsoft YaHei" font-size="19" fill="#42577a">其余外键见本节 SQL 定义</text>
