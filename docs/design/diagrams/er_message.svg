<rect x="875" y="445" width="680" height="58" fill="#e3e9f3" stroke="#aab4c2" stroke-width="2"/>
<text x="892" y="478" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">system_notifications  系统通知</text>
<text x="892" y="539" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">notification_id VARCHAR(50) PRIMARY KEY</text>
<text x="892" y="576" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">publisher_id BIGINT NOT NULL</text>
<text x="892" y="613" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">publish_status VARCHAR(10) NOT NULL DEFAULT &#x27;</text>
<text x="892" y="656" font-family="Microsoft YaHei" font-size="21" fill="#42577a">publisher_id → users</text>
<rect x="65" y="770" width="680" height="270" fill="#f7f9fc" stroke="#aab4c2" stroke-width="2"/>
<rect x="65" y="770" width="680" height="58" fill="#e3e9f3" stroke="#aab4c2" stroke-width="2"/>
<text x="82" y="803" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">notification_receipts  通知接收与阅读</text>
<text x="82" y="864" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">notification_id VARCHAR(50) NOT NULL</text>
<text x="82" y="901" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">user_id BIGINT NOT NULL</text>
<text x="82" y="938" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">PRIMARY KEY (notification_id,user_id)</text>
<text x="82" y="981" font-family="Microsoft YaHei" font-size="21" fill="#42577a">notification_id → system_notifications</text>
<text x="82" y="1011" font-family="Microsoft YaHei" font-size="21" fill="#42577a">user_id → users</text>
