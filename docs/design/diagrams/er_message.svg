<text x="82" y="153" font-family="Microsoft YaHei" font-size="26" fill="#1c2738">t_chat_session  私信会话</text>
<text x="82" y="214" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">session_id BIGINT PRIMARY KEY AUTO_INCREMENT</text>
<text x="82" y="251" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">sender_id BIGINT NOT NULL</text>
<text x="82" y="288" font-family="Microsoft YaHei" font-size="24" fill="#1c2738">receiver_id BIGINT NOT NULL</text>
<text x="82" y="331" font-family="Microsoft YaHei" font-size="21" fill="#42577a">sender_id → users</text>
<text x="82" y="361" font-family="Microsoft YaHei" font-size="21" fill="#42577a">receiver_id → users</text>
